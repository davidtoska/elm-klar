name: Showcase

# Publishes the showcase application (example/) on GitHub Pages.
# Turn it on once under Settings > Pages > Source: "GitHub Actions". After that it
# runs for every release tag, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/build-example.mjs --optimize

      - name: Collect the files of the page
        run: |
          mkdir _site
          cp example/index.html example/showcase.css example/main.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
